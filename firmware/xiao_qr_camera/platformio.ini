[env:xiao_esp32s3_sense]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
platform_packages = framework-arduinoespressif32@3.20017.0
lib_deps = bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DQUIRC_FLOAT_TYPE=float
    -DQUIRC_USE_TGMATH
