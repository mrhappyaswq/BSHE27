; PlatformIO needs this filename at the project root.
; See Docs/Project Map.md for a plain-language explanation.
[platformio]
default_envs = goouuu_esp32_s3
src_dir = Code
include_dir = Code
test_dir = Checks
lib_dir = Code/Third Party
core_dir = Build Tools/PlatformIO
workspace_dir = Build Tools/Temporary Files

[env:goouuu_esp32_s3]
platform = espressif32@6.10.0
framework = arduino
platform_packages = framework-arduinoespressif32@3.20017.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = +<*> -<Third Party/>
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
